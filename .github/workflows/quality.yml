name: Software quality

# Runs on the self-hosted runner next to the demo DashVERSE. No pull_request
# trigger: a public repository must not run fork code on a self-hosted runner.
on:
  push:
    branches: ['demo/**']
  workflow_dispatch:

jobs:
  resqui:
    runs-on: [self-hosted, dashverse-demo]
    steps:
      - uses: actions/checkout@v7

      # The indicators in .resqui.json are the ones this project commits to.
      # Any of them failing, or not being checked at all, fails the job.
      # Each assessment is uploaded to DashVERSE either way.
      - name: Check software quality indicators
        id: quality
        uses: BiodataAnalysisGroup/eosc-arena-software-quality-action@dashverse-upload
        with:
          config: .resqui.json
          fail-on: fail,not_run
          dashverse-token: ${{ secrets.DASHVERSE_TOKEN }}
          # The runner shares the host network with DashVERSE.
          dashverse-endpoint: http://127.0.0.1:3000

      - name: DashVERSE upload
        if: always()
        env:
          UPLOADED: ${{ steps.quality.outputs.uploaded }}
        run: echo "Uploaded to DashVERSE - $UPLOADED"
